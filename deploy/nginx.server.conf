# Install as /etc/nginx/conf.d/an-rag.conf only after checking
# active AND reserved ports. Test the existing Nginx before reloading it.
# This file belongs in an http-context include, such as conf.d.
limit_req_zone $binary_remote_addr zone=an_rag_requests:10m rate=30r/m;
# Image bytes are fetched one request per thumbnail. Authorization stays in the
# application; this only keeps a normal gallery view from being rate limited.
limit_req_zone $binary_remote_addr zone=an_rag_media:10m rate=300r/m;
# Page shells, scripts and the two session reads. Every response is no-store, so a
# page switch fetches all of them again and needs a bucket of its own. Keep the key of
# an existing zone as it is: nginx passes `-t` but refuses to reload when it changes.
limit_req_zone $binary_remote_addr zone=an_rag_pages:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=an_rag_connections:10m;

server {
    listen 8443 ssl;
    server_name rag.example.invalid;

    # Independent certificate/key; the leaf must contain DNS:rag.example.invalid SAN.
    ssl_certificate /opt/adaptive-rag/tls/server.crt;
    ssl_certificate_key /opt/adaptive-rag/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:an_rag_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    server_tokens off;

    # A 10 MB image expands to about 13.4 MB in the JSON Base64 upload.
    client_max_body_size 16m;
    client_body_timeout 15s;
    send_timeout 150s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn an_rag_connections 8;

    # Omit request URI/query strings, bodies and Authorization from logs.
    # Docker logs have separate rotation; configure host logrotate for this file.
    access_log off;
    error_log /opt/adaptive-rag/logs/nginx-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # Read-only image bytes only: library images and the figures shown inside evidence.
    # Every other asset and evidence route keeps the strict limit.
    location ~ ^(/assets/[^/]+/(thumbnail|content)|/evidence/[^/]+/[^/]+/images/[^/]+)$ {
        limit_except GET { deny all; }
        limit_req zone=an_rag_media burst=120 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }

    # Page shells, static files and the two reads that start every page. They change
    # nothing. Sharing the strict bucket below answered a quick switch between pages
    # (about 9 requests per page against 10 burst and 1 refill per 2 s) with 429 on a
    # random file, which left a bare background or the login page. Login, writes and
    # the model-backed routes stay on the strict catch-all.
    location ~ ^(/|/static/.+|/images|/knowledge|/evaluation|/console/session|/access/domains)$ {
        limit_except GET { deny all; }
        limit_req zone=an_rag_pages burst=60 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=an_rag_requests burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Pass the application's independent an_rag_session cookie unchanged.
        proxy_connect_timeout 5s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
    }
}
